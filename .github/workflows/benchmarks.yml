name: benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:           # also allow manual trigger from the Actions tab

permissions:
  contents: read
  pull-requests: write         # for PR comments

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run benchmark unit tests
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest \
            nwt_substrate/tests/test_benchmarks.py \
            nwt_substrate/tests/test_dark_sector_wimp.py -v

      - name: Run full benchmark suite (human-readable)
        run: |
          python -m nwt_substrate.benchmarks 2>&1 | tee benchmarks-${{ matrix.python-version }}.txt

      - name: Run full benchmark suite (JSON)
        run: |
          python -m nwt_substrate.benchmarks --json > benchmarks-${{ matrix.python-version }}.json

      - name: Regression check (total time < 500 ms)
        run: |
          python -m nwt_substrate.benchmarks --summary --max-time-ms 500

      - name: Job summary
        if: always()
        run: |
          echo "## Substrate benchmarks (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Substrate algebra vs traditional methods on this CI runner:' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m nwt_substrate.benchmarks --summary >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo 'Full benchmark output (top of report):' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -80 benchmarks-${{ matrix.python-version }}.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-py${{ matrix.python-version }}
          path: |
            benchmarks-${{ matrix.python-version }}.txt
            benchmarks-${{ matrix.python-version }}.json
          retention-days: 30
