coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%                  # tolerate ±1% movement without flagging
    patch:
      default:
        target: 80%                    # new code should be 80%+ covered
        threshold: 5%

  range: 60..90                        # red/yellow/green bands

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true                # only comment on PRs that change coverage
  require_base: false
  require_head: true

ignore:
  - "nwt_substrate/tests/**"                          # test code excluded from coverage
  - "**/__main__.py"                                  # CLI dispatchers
  - "nwt_substrate/diagrams.py"                       # figure factories — no logic
  - "**/diagrams.py"
  # Hardware-SDK paths — not coverable without a live backend (IBM Quantum,
  # AWS Braket, Steane device). These are thin adapter layers around vendor
  # SDKs; integration-tested via Heron experiments, not unit tests.
  - "nwt_substrate/qpu/adapters/ibm.py"
  - "nwt_substrate/qpu/adapters/braket.py"
  - "nwt_substrate/qpu/runner.py"
  - "nwt_substrate/qpu/experiments.py"
  - "nwt_substrate/heron/steane_pair_synthesis.py"
  - "nwt_substrate/heron/exp11_controls.py"
